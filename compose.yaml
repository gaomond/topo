services:
  api:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/topo
      SPRING_DATASOURCE_USERNAME: topo
      SPRING_DATASOURCE_PASSWORD: topo
      SERVER_PORT: "8080"
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: imresamu/postgis:17-3.5-bookworm
    environment:
      POSTGRES_DB: topo
      POSTGRES_USER: topo
      POSTGRES_PASSWORD: topo
    ports:
      - "5432:5432"
    volumes:
      - topo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  topo_pgdata:
